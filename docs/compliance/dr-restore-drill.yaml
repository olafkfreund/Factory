apiVersion: batch/v1
kind: Job
metadata:
  name: dr-restore-drill
  namespace: factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      volumes: [{name: scratch, emptyDir: {}}]
      initContainers:
        - name: fetch
          image: quay.io/minio/mc:RELEASE.2025-04-03T17-07-56Z@sha256:69fb6e6ca209008ae3cacf9f63c2524f68a1322dc921c8992ba2cc99c5bef3c6
          command: ["/bin/sh","-c"]
          args:
            - |
              set -euo pipefail
              export MC_CONFIG_DIR=/scratch/.mc
              mc alias set fac http://minio.factory.svc.cluster.local:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" >/dev/null
              latest=$(mc find fac/factory-backups/postgres --name "*.sql.gz" | tail -1)
              echo "restoring from: $latest"
              mc cp "$latest" /scratch/dump.sql.gz
              ls -l /scratch/dump.sql.gz
          env:
            - {name: S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-creds, key: S3_ACCESS_KEY}}}
            - {name: S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-creds, key: S3_SECRET_KEY}}}
          volumeMounts: [{name: scratch, mountPath: /scratch}]
      containers:
        - name: restore
          image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
          command: ["/bin/bash","-c"]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD=drill-throwaway-only
              H=pg-restore-target.dr-drill.svc.cluster.local
              until pg_isready -h "$H" -U factory >/dev/null 2>&1; do echo waiting; sleep 3; done
              echo "=== restoring ==="
              gunzip -c /scratch/dump.sql.gz | psql -h "$H" -U factory -d postgres -v ON_ERROR_STOP=0 2>&1 | tail -20
              echo "=== restore command finished ==="
          volumeMounts: [{name: scratch, mountPath: /scratch}]
