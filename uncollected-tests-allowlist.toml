# Test files in THIS repo that sit outside the paths CI collects.
#
# Read by `scripts/check_test_collection.py`, which derives the collected paths
# from this repo's own `.github/workflows/*.yml` rather than from a list here --
# see that script's docstring for why.
#
# THIS FILE IS NOT AN IGNORE LIST. Four rules, all enforced by the gate:
#
#   * An entry that matches NOTHING fails the gate (Factory#788). When a file
#     becomes collected, its entry must be deleted in the same PR. So this list
#     can only ratchet down.
#   * `reason` is validated. Placeholders (TODO, TBD, N/A, none, placeholder,
#     grandfathered) are rejected, as is anything under six words.
#   * `issue` is REQUIRED and must look like Repo#123. An uncollected test with
#     nobody's name on it is a permanent exception wearing a temporary hat.
#   * Exact paths, no globs. A glob is how one entry quietly comes to cover a
#     directory nobody reviewed.
#
# Adding an entry is a reviewable diff. That is the point.

[[allow]]
path = "scripts/test_model_probe.py"
reason = """
Not uncollected in substance -- contracts.yml runs it as `python3 scripts/test_model_probe.py`, \
deliberately, because it is a plain assert script with no pytest cases and no pytest dependency \
(Factory#489). It is outside `pytest tests/ shared/factory-common/tests/` on purpose and it does \
execute on every PR.
"""
issue = "Factory#489"
