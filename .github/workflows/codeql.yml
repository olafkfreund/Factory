name: CodeQL

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "51 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` added 2026-08-13. AIFactory, TFactory and factory-gitops
        # scanned it; the hub did not, so its own workflows were unexamined and
        # reported ZERO Actions alerts by not looking. TFactory reports 48
        # unpinned-tag and 1 untrusted-checkout from the same shape of file.
        # This is the #711 defect one level down: there it was a narrow query
        # SUITE, here it is an omitted LANGUAGE. Expect the count to rise on the
        # first scan; that is the change working, not a regression.
        language: [python, javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          # security-and-quality, not CodeQL's default suite (#711). This repo
          # reported ZERO open alerts while AIFactory reported ~1470 -- and the
          # survey found the gap was mostly which questions were asked. The
          # rules behind most of that volume (py/log-injection,
          # py/stack-trace-exposure, py/empty-except) are in this suite only.
          # A zero produced by asking less is the same defect as a gate that
          # cannot go red (#697). Passed as an input rather than a config file
          # because this repo has no custom query pack to compose with; if one
          # is ever added, this MUST move into the config, since a config-file
          # replaces this input.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
