name: factory-contracts (staleness gate)

# Single-source-of-truth gate for the generated factory-contracts package
# (epic Factory#154, issue Factory#160).
#
# WHAT THIS PROTECTS
# ------------------
# shared/factory-contracts/{python,ts} is GENERATED by scripts/gen_contracts.py
# from the canonical inputs:
#   - apis/completion-events.asyncapi.yaml  (RFC-0001 CompletionEvent + Usage)
#   - apis/status-taxonomy.json             (canonical lifecycle token sets)
# and COMMITTED so consumers (CFactory and the other factories) can pin a known
# version. If someone edits a token set or a schema field but forgets to rerun
# the generator and recommit, the committed output silently drifts from its
# inputs and every pinned consumer keeps reading the stale shape. This job fails
# the PR when that happens.
#
# WHY BLOCKING (not advisory like jscpd)
# --------------------------------------
# Regeneration is mechanical and deterministic (`python scripts/gen_contracts.py`
# rewrites the output byte-for-byte). There is no legacy backlog to grandfather:
# the committed output is either in sync with the inputs or it is not. So this is
# a hard gate from day one.

on:
  pull_request:
    paths:
      - "apis/completion-events.asyncapi.yaml"
      - "apis/status-taxonomy.json"
      - "scripts/gen_contracts.py"
      - "shared/factory-contracts/**"
      - "tests/test_gen_contracts.py"
      - "apis/agent-skills-manifest.schema.json"
      - "apis/examples/agent-skills/**"
      - "tests/test_agent_skills_manifest.py"
      - "apis/planning-card.schema.json"
      - "apis/examples/planning-cards/**"
      - "tests/test_planning_card.py"
      - "shared/factory-github/**"
      - "tests/test_provider_credential_repr.py"
      - "tests/test_provider_comments.py"
      - "scripts/apply_branch_protection.sh"
      - "tests/test_branch_protection_intent.py"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: committed output matches inputs (--check, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: gen_contracts --check (fail if committed output is stale)
        # The generator is dependency-free; --check compares the committed
        # output against a fresh render and exits non-zero on any drift.
        run: python scripts/gen_contracts.py --check

  self-test:
    name: generated package self-test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        # pydantic is required only by the generated module (the generator and
        # the staleness check above are dependency-free). The self-test imports
        # the generated package, so it is installed here.
        # httpx is imported at module scope by the shared provider modules,
        # which the credential-repr guard constructs for its behavioural check.
        run: pip install pytest "pydantic>=2" jsonschema httpx

      - name: Run the contracts self-test
        run: pytest -v tests/test_gen_contracts.py

      - name: Validate the agent-skills manifest schema + examples
        # RFC-0019 section 3.4 (Factory#302): the reference instances under
        # apis/examples/agent-skills/ are what every service copies, and the
        # fleet aggregate is folded from them. Runs as a step of this job
        # rather than its own, so the checkout/setup boilerplate is not
        # duplicated (jscpd clone budget).
        run: pytest -v tests/test_agent_skills_manifest.py

      - name: Validate the planning-card schema + examples
        # RFC-0019 section 3.1 (Factory#302): the card resource CFactory's
        # /api/cards is built to. Same job for the same reason as the step
        # above - a second job would duplicate the checkout/setup block and
        # eat into the jscpd clone budget, which only ratchets down.
        run: pytest -v tests/test_planning_card.py

      - name: Guard the shared providers against credential-repr leaks
        # Factory#372: a @dataclass field holding a PAT renders that PAT in the
        # generated __repr__, which reaches traceback frames, f-string logs and
        # error-reporting payloads. The guard is generic (it parses every module
        # under shared/factory-github/providers/ with ast), so a provider added
        # later is covered without anyone remembering to extend the test. Same
        # job as the steps above for the same reason - a separate job would
        # duplicate the checkout/setup block against the jscpd clone budget.
        run: pytest -v tests/test_provider_credential_repr.py

      - name: Guard the branch-protection drift gate's comparator
        # Factory#468: the drift gate compares the protection GitHub reports live
        # against the intent declared in scripts/apply_branch_protection.sh. If its
        # normaliser disagreed between the two wire shapes (live wraps booleans as
        # {"enabled": bool}, intent uses bare booleans) the gate would be
        # always-green - an always-green drift gate is the defect one level up from
        # the drift it exists to catch, and it cannot be noticed by running it.
        # These cases are offline: they need no token and never reach the network,
        # so they run on every PR while the gate itself runs nightly with a PAT.
        # Same job as the steps above for the same reason: a separate job would
        # duplicate the checkout/setup block against the jscpd clone budget.
        run: pytest -v tests/test_branch_protection_intent.py

      - name: Guard the shared providers' issue-comment read
        # Factory#375: comments are one API call PER ISSUE, and Factory#373
        # multiplies that per repository, so the guard asserts on the REQUESTS
        # the providers make (server-side `since`, GitHub's repository-wide bulk
        # endpoint, early stop on GitLab/ADO) and not only on the results - a
        # client-side filter over a full download returns correct data and is
        # still the rate-limit failure. Same job as the steps above for the same
        # reason: a separate job would duplicate the checkout/setup block against
        # the jscpd clone budget.
        run: pytest -v tests/test_provider_comments.py
