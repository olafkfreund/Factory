name: factory-contracts (staleness gate)

# Single-source-of-truth gate for the generated factory-contracts package
# (epic Factory#154, issue Factory#160).
#
# WHAT THIS PROTECTS
# ------------------
# shared/factory-contracts/{python,ts} is GENERATED by scripts/gen_contracts.py
# from the canonical inputs:
#   - apis/completion-events.asyncapi.yaml  (RFC-0001 CompletionEvent + Usage)
#   - apis/status-taxonomy.json             (canonical lifecycle token sets)
# and COMMITTED so consumers (CFactory and the other factories) can pin a known
# version. If someone edits a token set or a schema field but forgets to rerun
# the generator and recommit, the committed output silently drifts from its
# inputs and every pinned consumer keeps reading the stale shape. This job fails
# the PR when that happens.
#
# WHY BLOCKING (not advisory like jscpd)
# --------------------------------------
# Regeneration is mechanical and deterministic (`python scripts/gen_contracts.py`
# rewrites the output byte-for-byte). There is no legacy backlog to grandfather:
# the committed output is either in sync with the inputs or it is not. So this is
# a hard gate from day one.

# NO `paths:` FILTER, DELIBERATELY (Factory#489)
# ----------------------------------------------
# This used to carry a hand-maintained paths allowlist paired with a
# hand-maintained list of per-file pytest steps. Both rotted, in the same
# direction and for the same reason: a test file added to tests/ is not added
# to either list by anything, and nothing reports the omission. Ten of the
# hub's sixteen test files had accumulated that way and had never executed in
# CI once - including the comparators of all three BLOCKING, FLEET-WIDE drift
# gates, which every consumer repo fetches from hub main (Factory#405).
#
# An allowlist that must be edited by hand to stay correct is the same defect
# class this repo has already been bitten by twice inside the gates themselves
# (Factory#397: a canonical file absent from CANONICAL_FILES; Factory#401: a
# canonical module vendored by nobody). The fix there was to make the omission
# loud; the fix here is to remove the list. The whole suite now runs on every
# PR, so "wired but never triggered" is not a state this workflow can reach.
#
# Cost of running it unconditionally: two short jobs (the generator is
# dependency-free; the suite is ~1 minute).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: committed output matches inputs (--check, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: gen_contracts --check (fail if committed output is stale)
        # The generator is dependency-free; --check compares the committed
        # output against a fresh render and exits non-zero on any drift.
        run: python scripts/gen_contracts.py --check

  self-test:
    name: generated package self-test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, and the suite does not run without it. Factory#519's
          # comparator is a pathspec-scoped `git log <pin>..HEAD`, and
          # tests/test_pin_freshness.py asserts its verdict on REAL hub commits
          # — a pin that was honestly green in July and silently went stale two
          # days later. Under the default depth-1 checkout those revisions do
          # not exist and every case dies on "Invalid revision range".
          #
          # Deleting this line does not degrade the suite gracefully; it fails
          # six cases with an error that says nothing about clone depth. The
          # repo is 39M / ~300 commits and code-quality.yml already clones it
          # this way, so the cost is noise.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        # Every entry here is load-bearing for at least one test, and a MISSING
        # entry is not a loud failure - two of these suites call
        # pytest.importorskip() at module scope, so an absent dependency turns
        # the whole file into a SKIP and the step still reports green. That is
        # the Factory#489 defect in miniature, so what needs what is spelled out:
        #
        #   pydantic  the generated factory-contracts module (test_gen_contracts)
        #   jsonschema  the agent-skills / planning-card schema suites
        #   httpx     imported at module scope by the shared provider modules;
        #             importorskip'd by test_http_github_provider
        #   pyyaml    importorskip'd by test_validate_catalog
        #   mypy      test_ratchet_test_bar SHELLS OUT to it to prove the
        #             test-file carve-out is scoped by path. Pinned to the same
        #             version as code-quality.yml's MYPY_VERSION so the two
        #             gates measure the same bar.
        #   ruff      the same suite shells out to ruff for the other half of
        #             that carve-out (Factory#510: `**/tests/**` was unmatchable
        #             while the ratchet linted a temp copy). Pinned to
        #             code-quality.yml's RUFF_VERSION for the same reason as
        #             mypy - and NOT optional: with ruff absent these cases
        #             raise FileNotFoundError rather than skipping, which is
        #             loud, which is the point.
        #   pytest-asyncio  nine of test_http_github_provider's cases are
        #             `async def` behind @pytest.mark.asyncio. Without the
        #             plugin pytest does not run them; whether that shows up as
        #             a failure or as a bare PytestUnknownMarkWarning next to a
        #             green step depends on the pytest version, and the second
        #             is the Factory#489 shape again.
        run: >-
          pip install pytest pytest-asyncio "pydantic>=2" jsonschema httpx
          pyyaml "mypy==1.18.2" "ruff==0.15.17"

      - name: Run the hub test suite
        # WHOLE DIRECTORY, NOT A FILE LIST (Factory#489). This step used to be
        # seven per-file steps, each with a comment explaining the defect its
        # test locks. Ten further test files were added to tests/ over the same
        # period and never got a step, so they had never run in CI - among them
        # the comparators of the three blocking fleet-wide drift gates
        # (check_verification_core_drift, check_factory_github_drift,
        # check_factory_ui_drift). A comparator with a bug reports "no drift"
        # forever, in four repos at once, and running the gate cannot reveal it.
        #
        # The per-file rationale was not deleted: every one of these files
        # carries it in its own module docstring, which is where it belongs and
        # where it cannot fall out of step with the test it describes. What is
        # deleted is the hand-maintained list that made an unrun test possible.
        #
        # One step rather than a job per file for the reason the old steps all
        # cited: a second job duplicates the checkout/setup block against the
        # jscpd clone budget (Factory#161), which only ratchets down.
        run: pytest -v tests/

      - name: Guard the shared job-dispatch policy surface
        # Factory#483. scripts/job_dispatch.py carries a self-test with the rules
        # every dispatched Job must obey - including the pod-label rule whose
        # violation took a portal offline (TFactory#885), fed real API traffic to
        # a pod listening on nothing (AIFactory#1107), and broke a bucket-create
        # Job (Factory#458). Nothing ran it. The module is vendored into two
        # services and those rules are the contract they vendor it FOR, so a
        # canonical whose own guard never executes is the always-green gate one
        # level up from the drift it exists to catch. Stdlib-only, no deps, no
        # network - it runs as the module, not through pytest, because the
        # self-test IS the module's entry point and the consumers run it the same
        # way. Same job as the steps above for the same reason: a separate job
        # would duplicate the checkout/setup block against the jscpd clone budget.
        run: python3 scripts/job_dispatch.py

      - name: Guard the shared artifact-store key layout
        # Factory#488. Same shape as the step above and untestable until now: the
        # self-test imported job_dispatch._require, which resolves only in the
        # hub (both files flat in scripts/) and never in PFactory, which vendors
        # this module and by design vendors no job_dispatch at all. It now
        # defines its own assert helper, so it runs wherever the module runs.
        # It locks the canonical S3 key layout of
        # apis/concurrency-conventions.md §2, the workspace pack/unpack
        # round-trip, the path-traversal guard on extraction, and the role
        # object-tagging that MinIO lifecycle rules filter on (Factory#329 —
        # untagged evidence means retention silently never fires). Stdlib-only:
        # the S3 transport is lazy and the round-trip uses an in-module fake.
        run: python3 scripts/artifact_store.py

      - name: Guard the model-availability probe
        # Factory#489. scripts/test_model_probe.py is the hub's SEVENTEENTH test
        # file and does not live in tests/, so it is missed by both the audit
        # that opened #489 and by `pytest tests/` above - which is exactly how it
        # stayed unrun since #299. It guards model_probe.py, the comparator
        # behind the nightly model-probe workflow: it decides which models are
        # "new" and which are "deprecated" against a committed baseline, so a bug
        # in it reports a clean catalog forever. Offline, stdlib-only, and run as
        # a module because it is a plain `assert` script with no pytest cases.
        run: python3 scripts/test_model_probe.py
