name: secret-scan

on:
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # On pull_request/push events gitleaks-action scans only the PR/push diff
    # range (see gitleaks-action src/gitleaks.js log-opts handling). On
    # schedule and workflow_dispatch it applies no such restriction, so it
    # scans the full git history checked out below (fetch-depth: 0).
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # WITHOUT THIS the action uses its own bundled config and never reads
          # this repo's .gitleaks.toml, so every reviewed allowlist entry is
          # silently ignored. The full-history CLI step runs
          # `gitleaks detect --source .`, which picks the file up from the repo
          # root automatically -- so the two paths disagreed about the same
          # repo, and PRs failed on the secret scanner's OWN test fixtures
          # while the scheduled scan passed. Found on AIFactory#1335.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
