name: code-quality (ratchet)

# Factory code-quality ratchet (epic Factory#154; issues #156, #161).
#
# Per standards/coding-standards.md section 4.6, the strict bar is adopted as a
# no-regression RATCHET on the PR DIFF, not a whole-repo gate: legacy hotspots
# are allowed until touched, and a touched file's pre-existing legacy backlog
# does not block. What IS blocked is any NET-NEW ruff violation a changed file
# introduces relative to the PR base. A whole-repo strict `ruff check` would be
# instantly red (the hub's scripts/ carry ~198 legacy S/BLE/PL/T20 violations at
# adoption), so the ratchet (scripts/ratchet_lint.py) is used instead.
#
# mypy --strict on changed files is now ALSO a BLOCKING no-regression ratchet
# (Factory#254, mirroring CFactory#169): the legacy scripts are largely untyped,
# so a whole-repo strict run would be instantly red - instead the ratchet counts
# mypy --strict errors per changed file base-vs-head and fails only on NET-NEW
# type errors. A whole-repo `ruff format --check scripts/` stays blocking because
# formatting is mechanical and already clean.
#
# The hub owns standards/ — these jobs reference standards/ruff.toml /
# standards/mypy.ini directly via the vendored-at-root ruff.toml / mypy.ini.
#
# ratchet_lint.py is vendored from CFactory (cross-service reuse of the proven
# Factory ratchet); only the package scope differs (flat scripts/ dir).

on:
  # NO paths filter, deliberately (Factory#529). Two of these jobs are REQUIRED
  # status contexts on main. A path-filtered workflow does not report a "skipped"
  # context -- it reports nothing at all, and a required context that never
  # reports leaves the PR BLOCKED forever. That made every docs-only PR to main
  # unmergeable except by admin bypass, which trains the bypass and is worse than
  # having no rule.
  #
  # Running unconditionally is cheap: the ratchet exits 0 immediately on a diff
  # with no Python ("no changed Python under scripts; nothing to gate"), and the
  # format check is a few seconds over scripts/ + tests/.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the ruff that formatted scripts/ (hub pin, standards section 4.5).
  RUFF_VERSION: "0.15.17"
  MYPY_VERSION: "1.18.2"
  # Comma-separated (Factory#493). tests/ was outside every lint scope this repo
  # has: `ruff check` never looked at it, `ruff format --check` never looked at
  # it, and the ratchet's own test-file carve-out (#403) was reachable for
  # exactly one file — scripts/test_model_probe.py, the one test that does not
  # live in tests/. Since #496 wired the other seventeen suites into CI they are
  # load-bearing code (they include the comparators of all three blocking
  # fleet-wide drift gates), so they get the same gate as scripts/.
  PACKAGE_DIR: "scripts,tests"

jobs:
  ratchet:
    name: ruff + mypy ratchet (diff-scoped, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the PR base for the diff-scoped ratchet.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin the toolchain (standards section 4.5)
        run: |
          # types-PyYAML: scripts/check_chart_vs_gitops.py parses both deploy
          # engines as YAML (Factory#504). Stubs rather than a per-import
          # `type: ignore` — suppressing the checker to keep the checker quiet
          # is the shape this repo's ratchet exists to stop.
          #
          # pydantic + pytest, same reasoning, added for Factory#554. Without
          # them mypy resolves `BaseModel` and `pytest.mark.parametrize` to Any,
          # and `strict` then reports every subclass and every parametrised test
          # as a violation OF ITS OWN BLINDNESS: "Class cannot subclass BaseModel
          # (has type Any)", "Untyped decorator makes function untyped". The
          # ratchet was measuring an absent dependency, not the code.
          #
          # Measured across scripts/ + tests/ before landing this: 243 errors
          # with the stubs missing, 196 with them present, and NOT ONE FILE
          # gained an error. So this only ever lowers the bar's noise floor; it
          # cannot make a future PR red for something real stubs revealed.
          pip install "ruff==${RUFF_VERSION}" "mypy==${MYPY_VERSION}" types-PyYAML \
            "pydantic>=2" pytest

      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Ratchet (ruff on changed files; blocks net-new violations)
        # No-regression gate: a changed file may not GAIN ruff violations vs base.
        # Pure cleanup/formatting can never increase the count, so this stays green
        # for the adoption PR while catching genuinely new violations.
        run: python scripts/ratchet_lint.py --base "${{ steps.base.outputs.ref }}" --package "${PACKAGE_DIR}"

      - name: Ratchet (mypy --strict on changed files; blocks net-new type errors)
        # No-regression gate mirroring the ruff ratchet (Factory#254 / CFactory#169):
        # a touched legacy script keeps its existing mypy debt, but a PR may not add
        # net-new mypy --strict errors. The whole-repo strict backlog stays out of
        # scope until each file is individually cleaned.
        run: python scripts/ratchet_lint.py --tool mypy --base "${{ steps.base.outputs.ref }}" --package "${PACKAGE_DIR}"

  format-check:
    name: ruff format --check (scripts + tests, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin the toolchain (must match the formatter, section 4.5)
        run: pip install "ruff==${RUFF_VERSION}"

      - name: ruff format --check
        # Formatting is mechanical and already clean under scripts/ (the hub's
        # first-class Python) and tests/ (Factory#493 — one file needed a
        # reformat to widen this, done as its own commit). Scoped here rather
        # than whole-repo because the prototypes/, backups/, and review/ trees
        # carry pre-existing unformatted legacy that is out of this ratchet's
        # adoption scope (allowed until touched, per section 4.6); widening this
        # to "." would make the gate instantly red.
        #
        # Unlike the ratchet above, this is a WHOLE-TREE gate: it cannot
        # grandfather anything, so a directory can only be added here once it is
        # already clean.
        run: ruff format --check scripts/ tests/

  config-drift:
    name: vendored baseline matches standards/ (drift gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: root ruff.toml must extend the canonical baseline
        run: grep -q 'extend = "standards/ruff.toml"' ruff.toml

      - name: root mypy.ini must not loosen the strict baseline
        run: |
          # Tighten-only: the hub copy may not drop strict or any spelled-out flag
          # present in the canonical baseline (standards section 0 / 1.2).
          for key in $(grep -E '^[a-z_]+ = True' standards/mypy.ini | cut -d' ' -f1); do
            grep -qE "^${key} = True" mypy.ini || {
              echo "mypy.ini is missing strict flag: ${key}"; exit 1; }
          done
          grep -qE '^strict = True' mypy.ini

      - name: root .editorconfig matches the fleet baseline
        run: diff -u standards/.editorconfig .editorconfig
