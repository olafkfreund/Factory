[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordfreq"
version = "0.1.0"
description = "Deterministically count and rank words in text."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["wordfreq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
